<div class="instructions">Chapter 2: Click Challenge</div>

<div class="game-bg">
  <div class="game-card">
    <div class="counter">Clicks: {{ count }} / {{ targetClicks }}</div>
    <div class="win-message">{{ winMessage }}</div>

    <button class="click-button" (click)="handleClick()" [disabled]="isWon">
      Click me!
    </button>

    <button *ngIf="isWon" class="reset-button" (click)="resetGame()">
      Play again
    </button>
  </div>
</div>
